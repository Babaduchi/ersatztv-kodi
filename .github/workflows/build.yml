name: Build and validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  kodi-addon:
    name: Kodi add-on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate Python and XML
        run: |
          python -m compileall -q plugin.video.ersatztv
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for path in Path("plugin.video.ersatztv").rglob("*.xml"):
              ET.parse(path)
              print("valid:", path)
          PY
      - name: Package Kodi add-on
        run: zip -qr plugin.video.ersatztv-2.1.0.zip plugin.video.ersatztv -x '*/__pycache__/*'
      - name: Verify Kodi-installable ZIP structure
        run: |
          python - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile

          archive = "plugin.video.ersatztv-2.1.0.zip"
          with ZipFile(archive) as package:
              names = [PurePosixPath(name) for name in package.namelist()]
              roots = {path.parts[0] for path in names if path.parts}
              assert roots == {"plugin.video.ersatztv"}, "unexpected ZIP roots: {}".format(sorted(roots))
              assert PurePosixPath("plugin.video.ersatztv/addon.xml") in names, "addon.xml is not in the Kodi add-on root"
              assert not any(path.suffix.lower() == ".zip" for path in names), "nested ZIP detected"
          print("Kodi ZIP structure is valid and contains no nested archive")
          PY
      - name: Publish direct Kodi installable ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/compile-ersatztv-kodi'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v2.1.0 >/dev/null 2>&1; then
            gh release create v2.1.0 --target "$GITHUB_SHA" --title "ErsatzTV Kodi Add-on 2.1.0" --notes "Download plugin.video.ersatztv-2.1.0.zip below and install it directly in Kodi. Do not unzip it. This release asset is not wrapped in a GitHub Actions artifact."
          fi
          gh release upload v2.1.0 plugin.video.ersatztv-2.1.0.zip --clobber

  companion-dotnet:
    name: Compile companion against ErsatzTV v26.5.1
    runs-on: ubuntu-latest
    env:
      # v26.5.1 pins packages whose author certificate was later revoked.
      # Inputs remain pinned to the official ErsatzTV tag and NuGet.org.
      DOTNET_NUGET_SIGNATURE_VERIFICATION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Fetch pinned ErsatzTV source
        run: git clone --depth 1 --branch v26.5.1 https://github.com/ErsatzTV/legacy.git upstream
      - name: Add management controller
        run: cp ersatztv-kodi-companion/ErsatzTV/Controllers/Api/KodiManagementController.cs upstream/ErsatzTV/Controllers/Api/
      - name: Restore
        working-directory: upstream
        run: dotnet restore ErsatzTV/ErsatzTV.csproj -p:NuGetAudit=false
      - name: Compile
        working-directory: upstream
        run: dotnet build ErsatzTV/ErsatzTV.csproj -c Release --no-restore
      - name: Publish compiled application
        working-directory: upstream
        run: dotnet publish ErsatzTV/ErsatzTV.csproj -c Release --no-restore --no-self-contained -o ../compiled-companion
      - uses: actions/upload-artifact@v4
        with:
          name: ersatztv-kodi-companion-compiled-v26.5.1
          path: compiled-companion/
          if-no-files-found: error

  companion-container:
    name: Build companion container
    runs-on: ubuntu-latest
    needs: companion-dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ersatztv-kodi-companion
          push: false
          load: true
          tags: ersatztv-kodi:test
          build-args: ERSATZTV_VERSION=v26.5.1
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Inspect built image
        run: docker image inspect ersatztv-kodi:test
